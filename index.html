<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Golden</title>
<style>
:root{--bg:#080b13;--p:#111827;--line:#27324a;--txt:#f7f8fb;--mut:#98a4ba;--gold:#f6bd42;--gold2:#ffe08b}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--txt)}
body{background:radial-gradient(circle at 85% 0,rgba(246,189,66,.13),transparent 30%),var(--bg)}
.app{height:100%;display:grid;grid-template-columns:280px 1fr}.side{padding:16px;border-right:1px solid var(--line);background:#0d1220;display:flex;flex-direction:column;gap:12px}
.logo{font-size:23px;font-weight:950}.logo b{color:var(--gold)}button,textarea{font:inherit}.new{padding:12px;border:1px solid #5a4722;border-radius:14px;background:#241e12;color:#ffe1a0;font-weight:850}
.hist{overflow:auto}.hist button{width:100%;padding:10px;border:0;border-radius:11px;background:transparent;color:#dfe4ee;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist button:hover,.hist .active{background:#182135}
.note{margin-top:auto;color:var(--mut);font-size:12px;line-height:1.5}.main{height:100%;min-width:0;display:grid;grid-template-rows:62px 1fr}
.top{border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;background:rgba(8,11,19,.78);backdrop-filter:blur(14px)}.sp{flex:1}.model{font-size:12px;padding:7px 10px;border-radius:999px;background:#151e30;border:1px solid var(--line);color:#dbe1ec}.menu{display:none;background:#192238;color:white;border:0;border-radius:10px;width:38px;height:38px;margin-right:10px}
.chat{overflow:auto;padding:28px 16px 150px}.wrap{max-width:860px;margin:auto}.welcome{text-align:center;padding-top:12vh}.orb{width:74px;height:74px;margin:auto;border-radius:22px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:#211a09;font-size:28px;font-weight:950}.welcome h1{font-size:clamp(34px,7vw,58px);margin:18px 0 8px}.welcome p{color:var(--mut);line-height:1.6}
.msg{display:grid;grid-template-columns:38px 1fr;gap:10px;margin-bottom:18px}.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900}.user .av{background:#25314a}.assistant .av{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1508}.bubble{padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#121a2a;line-height:1.65;overflow-wrap:anywhere}.user .bubble{background:#202a40}.bubble pre{background:#070a11;border:1px solid #202b40;border-radius:12px;padding:12px;overflow:auto}.bubble code{font-family:ui-monospace,Consolas,monospace}
.composeWrap{position:fixed;bottom:0;left:280px;right:0;padding:18px 16px 20px;background:linear-gradient(transparent,#080b13 34%)}.status{max-width:860px;margin:auto auto 6px;color:var(--mut);font-size:12px}.compose{max-width:860px;margin:auto;display:flex;gap:8px;align-items:flex-end;background:#111827;border:1px solid #35425d;border-radius:20px;padding:9px;box-shadow:0 18px 45px #0008}textarea{flex:1;border:0;outline:0;resize:none;max-height:180px;min-height:46px;padding:12px;background:transparent;color:white;line-height:1.45}.send{width:46px;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));font-weight:950}.send:disabled{opacity:.45}.err{color:#ff8996}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;inset:0 auto 0 0;width:min(84vw,300px);transform:translateX(-101%);transition:.2s}.side.open{transform:none}.menu{display:block}.composeWrap{left:0}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="logo">AI <b>Golden</b></div><button class="new" id="new">＋ Chat baru</button><div class="hist" id="hist"></div><div class="note">AI berjalan di server kami!.<br>Model: <b>Golden Mark 1</b><br>Riwayat chat disimpan di browser.</div></aside>
<main class="main">
<header class="top"><button class="menu" id="menu">☰</button><b>AI Golden</b><div class="sp"></div><div class="model">Golden Mark 1</div></header>
<section class="chat" id="chat"><div class="wrap" id="msgs"></div></section>
<div class="composeWrap"><div class="status" id="status">Siap</div><div class="compose"><textarea id="input" rows="1" placeholder="Ketik pesan..."></textarea><button class="send" id="send">➤</button></div></div>
</main></div>
<script>
const $=s=>document.querySelector(s),msgs=$("#msgs"),input=$("#input"),status=$("#status"),send=$("#send");
let data=JSON.parse(localStorage.getItem("golden_chats")||"{}"),id=localStorage.getItem("golden_id")||"";
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function md(t){let s=esc(t);s=s.replace(/```([\w+-]*)\n([\s\S]*?)```/g,"<pre><code>$2</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");return s}
function ensure(){if(!id||!data[id]){id=uid();data[id]={title:"Chat baru",messages:[],updated:Date.now()};save()}return data[id]}
function save(){localStorage.setItem("golden_chats",JSON.stringify(data));localStorage.setItem("golden_id",id);history()}
function history(){let h=$("#hist");h.innerHTML="";Object.entries(data).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0)).forEach(([k,c])=>{let b=document.createElement("button");b.textContent=c.title;b.className=k===id?"active":"";b.onclick=()=>{id=k;save();render();$("#side").classList.remove("open")};h.appendChild(b)})}
function render(){let c=ensure();if(!c.messages.length){msgs.innerHTML='<div class="welcome"><div class="orb">AI</div><h1>AI Golden</h1><p>Asisten AI gratis untuk coding, belajar, ide, dan percakapan sehari-hari.</p></div>';return}msgs.innerHTML="";c.messages.forEach(m=>bubble(m.role,m.content));bottom()}
function bubble(role,text){let d=document.createElement("div");d.className="msg "+role;d.innerHTML=`<div class="av">${role==="user"?"U":"AI"}</div><div class="bubble">${md(text)}</div>`;msgs.appendChild(d);bottom();return d.querySelector(".bubble")}
function bottom(){requestAnimationFrame(()=>$("#chat").scrollTop=$("#chat").scrollHeight)}
async function ask(){let text=input.value.trim();if(!text||send.disabled)return;let c=ensure();if(!c.messages.length)c.title=text.slice(0,45);c.messages.push({role:"user",content:text});c.updated=Date.now();save();if(msgs.querySelector(".welcome"))msgs.innerHTML="";bubble("user",text);input.value="";input.style.height="auto";send.disabled=true;status.textContent="AI sedang menjawab...";let out=bubble("assistant","");
try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:c.messages})});if(!r.ok)throw new Error(await r.text());let reader=r.body.getReader(),dec=new TextDecoder(),full="";while(true){let {value,done}=await reader.read();if(done)break;full+=dec.decode(value,{stream:true});out.innerHTML=md(full);bottom()}full+=dec.decode();c.messages.push({role:"assistant",content:full});c.updated=Date.now();save();status.textContent="Siap"}catch(e){out.innerHTML='<span class="err">Gagal: '+esc(e.message)+'</span>';status.textContent="Terjadi error"}finally{send.disabled=false}}
send.onclick=ask;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}};input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px"};$("#new").onclick=()=>{id=uid();data[id]={title:"Chat baru",messages:[],updated:Date.now()};save();render();$("#side").classList.remove("open")};$("#menu").onclick=()=>$("#side").classList.toggle("open");ensure();history();render();
</script>
</body></html>
